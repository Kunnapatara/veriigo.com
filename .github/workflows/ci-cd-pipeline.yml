name: VERIIGO V2 Phase 7 Production CI/CD Pipeline

on:
  push:
    branches: [ main, production ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-typecheck:
    name: Lint & TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install Dependencies
        run: npm ci
      - name: Run Linter
        run: npm run lint

  unit-and-integration-tests:
    name: Execute Automated Test Suite
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install Dependencies
        run: npm ci
      - name: Run Vitest Suite
        run: npx vitest run

  security-and-vulnerability-scan:
    name: Security & Audit Scan
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v3
      - name: Dependency Vulnerability Audit
        run: npm audit --audit-level=high

  build-and-deploy-staging:
    name: Build & Deploy to Staging (Cloud Run)
    runs-on: ubuntu-latest
    needs: [unit-and-integration-tests, security-and-vulnerability-scan]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
      - name: Build Application Bundle
        run: npm run build
      - name: Deploy Staging Container
        run: echo "Deploying container to Cloud Run Staging..."

  production-release-and-smoke-test:
    name: Production Release & Smoke Verification
    runs-on: ubuntu-latest
    needs: build-and-deploy-staging
    if: github.ref == 'refs/heads/production'
    steps:
      - uses: actions/checkout@v3
      - name: Deploy Production Container
        run: echo "Deploying container to Cloud Run Production..."
      - name: Run Production Smoke Test
        run: curl -f https://veriigo-prod.run.app/health/readiness || exit 1
